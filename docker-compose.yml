version: '3.8'

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_rag_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data  # Mount data directory for persistent ChromaDB storage
    env_file:
      - .env
    restart: unless-stopped
